# docker-compose.yml
services:
  medicalshiftplanner:
    build:
      context: .
      dockerfile: Dockerfile
    image: medicalshiftplanner-app
    ports:
      - "8501:8501"       # ← publish container’s 8501 to your host
    command: >
      streamlit run main.py
        --server.address 0.0.0.0
        --server.port 8501
